<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Operations Dashboard · Shwapno</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
<link rel="stylesheet" href="assets/styles.css?v=zr3">
<link rel="stylesheet" href="assets/ui-updates.css?v=dr1">
<link rel="stylesheet" href="assets/network.css?v=act7">
<link rel="stylesheet" href="assets/report.css?v=aud1">
<link rel="stylesheet" href="assets/cw.css?v=pk1">
<link rel="stylesheet" href="assets/ar.css?v=ar35">
<link rel="stylesheet" href="assets/sidebar.css?v=zr3">
<script>try{var t=localStorage.getItem('opsdash-theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body>
<div class="shell">
  <aside class="rail" id="rail" aria-label="Navigation and filters">
    <div class="brand"><img class="brand-mark" src="assets/shwapno-logo.jpg" alt="Shwapno" width="72" height="36"><div class="brand-t"><strong>Operations</strong><small>Shwapno retail</small></div>
      <button class="sb-toggle" id="sbToggle" type="button" aria-controls="rail" aria-label="Collapse sidebar" title="Collapse sidebar"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 3v18"/></svg></button></div>
    <button class="sb-search" id="sbSearch" type="button" title="Search (Ctrl+K)" aria-haspopup="dialog"><svg class="nav-ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span class="nav-t">Search</span><kbd>Ctrl K</kbd></button>
    <nav class="nav" id="nav"></nav>
    <section class="filters" id="filters" aria-label="Filters"></section>
    <footer class="rail-foot" id="railFoot"></footer>
    <a class="rail-credit" href="mailto:tawhidul@acilogistics.net" title="Built and developed by Tawhid · tawhidul@acilogistics.net"><span class="sb-avatar" aria-hidden="true">T</span><span class="sb-who"><strong>Tawhid</strong><span>Sr. Executive, Retail Operations</span><small>Build &amp; develop · tawhidul@acilogistics.net</small></span></a>
  </aside>
  <div class="scrim" id="scrim" hidden></div>
  <main class="main">
    <header class="topbar">
      <button class="btn icon rail-btn" id="railBtn" aria-controls="rail" aria-label="Hide sidebar">⇤</button>
      <button class="btn icon menu-btn" id="menuBtn" aria-label="Open menu">☰</button>
      <div class="title-block"><h1 id="pageTitle">Overview</h1><p class="scope" id="scope"></p></div>
      <div class="top-ec" id="topEc" hidden></div>
      <div class="top-tools">
        <label class="top-sel" id="periodSeg"></label>
        <label class="top-sel" id="storeSeg" hidden></label>
        <span class="fresh" id="fresh"></span>
        <button class="btn ai-top" id="aiFab" type="button" aria-haspopup="dialog" aria-pressed="false" aria-label="Shwapno Intelligence (SI)" title="Shwapno Intelligence (SI): ask about this dashboard"><span aria-hidden="true">✦</span> <span class="ai-long">Shwapno Intelligence <span class="ai-si">(SI)</span></span><span class="ai-short">SI</span></button>
        <button class="btn" id="resetBtn">Clear filters</button>
        <button class="btn icon" id="themeBtn" aria-label="Switch theme">◐</button>
      </div>
    </header>
    <div class="pills" id="pills"></div>
    <div class="view" id="view"><p class="empty">Loading data…</p></div>
  </main>
</div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" hidden>
  <header class="drawer-head"><h2 id="drawerTitle"></h2><button class="btn" id="drawerClose">Close</button></header>
  <div class="drawer-body" id="drawerBody"></div>
</aside>
<div id="reportOverlay" role="dialog" aria-modal="true" aria-label="Regional head summary report">
  <div class="report-toolbar">
    <div><h2>Regional head summary report</h2><p id="reportMeta"></p></div>
    <span class="spacer"></span>
    <span class="report-busy" id="reportBusy" hidden>Rendering image…</span>
    <button class="btn primary" id="reportPrint" type="button">Print or save as PDF</button>
    <button class="btn" id="reportPng" type="button">Download PNG</button>
    <button class="btn" id="reportClose" type="button">Close</button>
  </div>
  <div class="report-sheet" id="reportSheet"></div>
</div>
<script src="assets/ecom-customers.js?v=ec-done1"></script>
<script src="assets/app.js?v=ec-night1"></script>
</body>
</html>
