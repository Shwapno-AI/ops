server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/json text/css application/javascript;

    location = /healthz { auth_basic off; access_log off; return 200 "ok"; }

    include /etc/nginx/auth.conf;   # written at start-up; empty unless BASIC_AUTH_* is set

    location = /data/data.json { add_header Cache-Control "no-cache"; }
    location = /data/network.json { add_header Cache-Control "no-cache"; }
    location = /data/cw.json { add_header Cache-Control "no-cache"; }
    location = /data/av.json { add_header Cache-Control "no-cache"; }
    location = /data/rcv.json { add_header Cache-Control "no-cache"; }
    location = /data/sku.json { add_header Cache-Control "no-cache"; }
    location = /data/sku-rl.json { add_header Cache-Control "no-cache"; }
    location /data/sku-outlet/ { add_header Cache-Control "no-cache"; }
    location = /data/sa.json { add_header Cache-Control "no-cache"; }
    location = /data/sa-remarks.json { add_header Cache-Control "no-cache"; }
    location = /data/ccv.json { add_header Cache-Control "no-cache"; }
    location = /data/stockgap.json { add_header Cache-Control "no-cache"; }
    location = /data/rcv-drill/index.json { add_header Cache-Control "no-cache"; }
    location /data/sales/ { add_header Cache-Control "no-cache"; }
    # Ask AI relay (scripts/ai/server.py): holds the AI keys; behind the same login as the dashboard
    location /api/ai/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_read_timeout 120s;
        client_max_body_size 1m;
        add_header Cache-Control "no-store";
    }
    location / { try_files $uri $uri/ =404; }
}
