name: Deploy dashboard

on:
  push:
    branches: [main]
    paths:
      - index.html
      - assets/**
      - data/data.json
      - data/network.json
      - data/cw.json
      - data/av.json
      - data/rcv.json
      - data/sku.json
      - data/sku-rl.json
      - .nojekyll
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:   # also started by the Refresh data workflow when the data changed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          # full history without old file contents (commits and trees only): enough to date every file below
          fetch-depth: 0
          filter: blob:none
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare the website
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -R assets data _site/
      - name: Date each file by its last change
        # A fresh checkout stamps every file with the time of the run. Dating each file by the commit that last
        # changed it keeps an unchanged file's Last-Modified (and the ETag built from it) the same across
        # deploys, so browsers revalidate it with a 304 instead of downloading it again after every data refresh.
        run: |
          git -c core.quotepath=off log --format='@%ct' --name-only -- index.html assets data \
            | awk '/^@/ { t = $0; next } NF && !($0 in seen) { seen[$0] = 1; print t "\t" $0 }' \
            | while IFS="$(printf '\t')" read -r t f; do [ -f "_site/$f" ] && touch -d "$t" "_site/$f"; done
          touch -d "$(git log -1 --format=@%ct -- .nojekyll)" _site/.nojekyll 2>/dev/null || true
      - name: Upload the website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
