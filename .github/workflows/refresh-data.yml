name: Refresh data

on:
  schedule:
    - cron: "0 2-17 * * *"   # every hour, 8 am to 11 pm Dhaka time (UTC+6)
  workflow_dispatch:          # "Run workflow" button for an instant refresh

permissions:
  contents: write   # commit the refreshed data files
  actions: write    # start the deploy workflow when the data changed

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      # One download of each Drive file, shared by the four builds and kept between runs.
      # Files are keyed by Drive id + last-modified, so only new or changed files are downloaded.
      DRIVE_CACHE: /tmp/drive-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Restore the Drive download cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/drive-cache
          key: drive-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: drive-cache-
      - name: Mark the start of this run
        run: mkdir -p /tmp/drive-cache && touch /tmp/run-start && sleep 1
      - name: Download Drive files and build data.json
        run: python scripts/build_data.py
      - name: Download outlet network files and build network.json
        # A failure here keeps the last good network.json and never blocks data.json.
        continue-on-error: true
        run: python scripts/network/refresh.py
      - name: Download consumable and wastage files and build cw.json
        continue-on-error: true
        run: python scripts/cw/refresh.py
      - name: Download availability files and build av.json
        continue-on-error: true
        run: python scripts/av/refresh.py
      - name: Download the receiving snapshot and build rcv.json
        continue-on-error: true
        run: python scripts/rcv/refresh.py
      - name: Download item-performance workbooks and build sku.json
        # Rebuilds only when a workbook changed; about 4 minutes when it does.
        continue-on-error: true
        env:
          SKU_OUTLET_FILES: "0"   # per-outlet SKU lists are built only on the Coolify server
        run: python scripts/sku/refresh.py
      - name: Download store assessment audits and build sa.json
        # Only months whose file changed are downloaded again.
        continue-on-error: true
        run: python scripts/sa/refresh.py
      - name: Download credit card and visit files and build ccv.json
        continue-on-error: true
        run: python scripts/ccv/refresh.py
      - name: Drop cached files this run did not use
        if: always()
        run: find /tmp/drive-cache -type f ! -newer /tmp/run-start -delete; du -sh /tmp/drive-cache || true
      - name: Save the Drive download cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/drive-cache
          key: drive-cache-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish if the data changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/data.json data/network.json data/cw.json data/av.json data/rcv.json data/sku.json data/sku-rl.json data/sa.json data/sa-remarks.json data/ccv.json; then echo "No data changes."; exit 0; fi
          git config user.name "ops-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.json data/network.json data/network-sync.json data/cw.json data/av.json data/rcv.json data/sku.json data/sku-rl.json data/sa.json data/sa-remarks.json data/ccv.json
          git commit -m "Refresh data $(date -u +'%Y-%m-%d %H:%M') UTC"
          # Someone may have pushed code while this run was busy: replay the data commit on top and retry.
          pushed=0
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then pushed=1; break; fi
            echo "Push attempt $attempt failed; retrying."; sleep $((attempt * 10))
          done
          if [ "$pushed" != 1 ]; then echo "::error::Could not push the refreshed data."; exit 1; fi
          # Pushes made with the workflow token do not start other workflows, so start the deploy here.
          gh workflow run deploy-pages.yml --ref main
