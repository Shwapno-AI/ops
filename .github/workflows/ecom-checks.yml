name: E-commerce checks

on:
  pull_request:
    paths:
      - assets/app.js
      - assets/ecom-customers.js
      - scripts/ecom/**
      - scripts/prepare-pages.sh
      - tests/**
      - deploy/**
      - Dockerfile
      - .github/workflows/**
      - .gitignore
      - .dockerignore
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install openpyxl==3.1.5
      - name: Check syntax and synthetic regressions
        run: |
          node --check assets/app.js
          node --check assets/ecom-customers.js
          sh -n deploy/entrypoint.sh scripts/prepare-pages.sh
          node --test tests/*.mjs
          python -m unittest discover -s tests -p 'test*.py'
      - name: Reject customer snapshots in public source
        run: |
          if git ls-files 'data/ecom.json*' private/ | read -r snapshot; then
            echo "::error::E-commerce customer snapshots must not be committed."
            exit 1
          fi
